# Run the test suite on every push and pull request, so regressions are
# caught before the weekly recalibration job trips over them.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the test suite
        run: python3 -m unittest discover tests
