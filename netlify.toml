# Static deploy: the browser-based simulator (index.html) is the site.
# The Python engine (plsim/), Streamlit dashboard and data files live in
# the repo but are not part of the deployed site.
[build]
  publish = "."
  command = ""

# The shared model bundle both this site and Gameweek Edge consume.
# Public, cacheable, CORS-open so other origins can fetch it.
[[headers]]
  for = "/model.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
