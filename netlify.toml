# Static deploy: the browser-based simulator (index.html) is the site.
# The Python engine (plsim/), Streamlit dashboard and data files live in
# the repo but are not part of the deployed site.
[build]
  publish = "."
  command = ""

# The published model bundle. Public, cacheable, CORS-open so other origins
# can fetch it (the PL Bookings Desk ingests these ratings at build time).
[[headers]]
  for = "/model.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# Per-club JSON endpoints (tools/build_clubs.py): public, cacheable,
# CORS-open so other origins can consume them.
[[headers]]
  for = "/clubs/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# The service worker must revalidate on every load so new versions of
# the app shell roll out promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
